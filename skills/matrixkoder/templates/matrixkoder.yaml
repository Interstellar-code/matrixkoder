# Template for the project's project.yaml — the MatrixKoder onboarding wizard fills this in and,
# after the user's one confirm, writes it to ~/.matrixkoder/projects/<slug>/project.yaml (C2/C8).
# Today's matrixkoder.yaml name and the repo-local location are the pre-2026-10-15 layout; every
# path now comes from scripts/mkpaths.py / hooks/paths.ts (C1) and the repo keeps no MK data.
# Re-checked for drift on every run; the user's explicit statements override any value.
# Every key is a yaml key: level `project`, home `yaml` (C8). The `userConfig` keys (dashboard
# prefs, guards, wake, usagePollMin) live in the plugin config, not here — `mk-config.py migrate`
# drops the dead yaml copies (`dashboard:`, `usage.poll_min`); ~/.matrixkoder/config.json is retired.
data_dir: .matrixkoder/               # the data dir the path resolvers record for this project (C1)
repo:
  integration_branch: main            # lanes merge here; one PR to main at the end
  lanes: { slots: 1, pattern: "../{repo}-mk-{n}", reuse: true, copy: [] }   # reusable worktree slots; the cap is max_build_lanes; copy = untracked paths a new slot needs (.env, generated types)
  conventions: []                     # from CLAUDE.md / AGENTS.md, e.g. "never run pnpm check repo-wide"
gates:                                # the four project gates a plan's `use` list may name (C3)
  test: ""                            # e.g. pnpm vitest run
  typecheck: ""                       # e.g. pnpm exec tsc --noEmit
  lint: ""                            # e.g. pnpm exec eslint .
  build: ""                           # e.g. pnpm run build
baselines:                            # measured at bootstrap, refreshed each run
  type_errors: null
  lint_errors: null
  known_failing_tests: []
banned_commands: []                   # dev servers, sidecar boots, deploys, repo-wide formatters
qa:
  frontend: false
  start: ""                           # orchestrator only
  integration_target: local-main      # local-main = merge reviewed lanes into local main (no push) and QA on the user's running dev server; branch = QA a separate build
  dev_url: ""                         # e.g. https://localhost:3000 (always running)
  port: null
  themes: []
  mockups: ""                         # e.g. <project>/plans/<id>/assets/
agents:                               # installed + logged in, verified at bootstrap
  codex: { available: null, models: [] }
  opencode: { available: null, models: [] }
  agy: { available: null, models: [] }
  claude: { available: true }
  checked_at: null
picks:                                # each agent's models in preference order (max 4, from agents.<agent>.models)
  codex: []
  opencode: []
  agy: []
session:                              # how build/review rounds run in their panes
  fresh_session: new                  # a fix/takeover round starts a fresh agent session (/new OpenCode, /clear Claude); "same" keeps it
  subagents: true                     # a phase may hand its tasks to subagents
  subagent_model: ""                  # the model a subagent runs on (empty: the orchestrator's own)
  stall_min: 15                       # idle minutes before a working lane is called stalled
  max_wait_min: 30                    # minutes lane-watch waits before it gives up
  reviewer_split: right               # where the reviewer pane goes while the builder waits: right (beside the lane) or down
  reuse_reviewer: true                # one reviewer session serves the phase's rounds
routing_preferences:
  policy: claude-sparing              # Claude Code orchestrates; builders below
  builder_order: [codex, opencode, agy, claude]
  effort_by_size: { trivial: low, standard: medium, complex: high, final_review: max }   # Jev may shift one step
  reserve_floor:
    claude: { five_hour_left_pct: 40, weekly_left_pct: 30 }
    others: { five_hour_left_pct: 10, weekly_left_pct: 15 }
  max_build_lanes: 3
  reviewer: claude sonnet medium      # the route every review goes to
  visual_reviewer: claude haiku       # the route a visual/UI review goes to
autonomy_contract:
  pause_only_for: [destructive-not-preauthorised, all-agents-below-floor, uncovered-scope-decision, secrets-or-user-config, lock-over-30min, fix-loop-exhausted, blocked-approval-dialog, jev-screen-block]
  preauthorised: [routing, failover, fix-loops, worktrees, lane-merges, push-non-main, open-pr]
  builder_skip_permissions: true      # builders only, in their own worktree; never orchestrator/reviewers/runtime lanes
deploy:
  readme: <project>/deploys/README.md   # repo-specific checklist; always user-gated (<project> = the project folder)
locks:
  dir: ~/.matrixkoder/locks            # managed via mk-state lock take|release|check
usage:
  source: codexbar                    # one source for all agents; mk-usage.py -> ~/.matrixkoder/usage.json
  providers: [claude, codex, antigravity]   # add zai when the OpenCode plan key is set in CodexBar
